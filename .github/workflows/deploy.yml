# Build the container on every push to main, push it to ECR.
# App Runner has auto_deployments_enabled, so a new :latest triggers a
# rolling deploy on its own — no deploy step needed here.
name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC token for AWS
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: argo-float-monitor

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test (import app, hit /healthz)
        run: |
          python -m pip install -q -r requirements.txt
          python -c "import app; c=app.server.test_client(); r=c.get('/healthz'); assert r.status_code==200, r.data; print(r.json)"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
